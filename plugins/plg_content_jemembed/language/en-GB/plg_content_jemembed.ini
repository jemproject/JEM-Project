PLG_CONTENT_JEMEMBED="JEM - Embed Plugin"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_LABEL="Require API Token"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_DESC="If enabled, API requests must send a valid token in the Authorization Bearer header. Disabling authentication keeps the fixed public request limits active."
PLG_CONTENT_JEMEMBED_API_TOKENS_LABEL="API Tokens"
PLG_CONTENT_JEMEMBED_API_TOKENS_DESC="Enter up to 20 long random tokens, comma-separated. For storage without the original secret, use sha256: followed by its 64-character SHA-256 digest. Multiple entries allow safe token rotation."
PLG_CONTENT_JEMEMBED_BASE_URL_LABEL="Canonical JEM URL"
PLG_CONTENT_JEMEMBED_BASE_URL_DESC="Optional trusted HTTP(S) base URL used to create absolute event, venue and category links, for example https://events.example.org. If empty or invalid, the API returns relative links and never derives an origin from the request Host header."
