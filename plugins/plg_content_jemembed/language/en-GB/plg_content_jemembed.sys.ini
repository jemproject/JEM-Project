PLG_CONTENT_JEMEMBED="JEM - Embed Plugin"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="JEM Embed Plugin provides a bounded JSON API for public JEM event data."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>The plugin provides published JEM events as JSON for a server-side integration or proxy. Keep the API token on the server and send it in the HTTP <code>Authorization: Bearer YOUR_SECURITY_TOKEN</code> header. Tokens in URL query parameters are rejected because URLs may be stored in browser history, server logs, referrers and intermediary caches.</p><p><strong>Endpoint</strong><br><code>https://domain.example/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;type=upcoming&amp;max=10</code></p><p><strong>Parameters</strong><br><code>type=today|unfinished|ongoing|upcoming|archived|newest|open|all<br>featured=on|off|only<br>title=on|link|off<br>date=on|link|off<br>time=on|off<br>enddatetime=on|off<br>catids=[up to 50 comma-separated category IDs]<br>category=on|link|off<br>venueids=[up to 50 comma-separated venue IDs]<br>venue=on|link|off<br>max=1..100<br>start=0..10000<br>cuttitle=1..500<br>dateformat=[up to 64 characters]<br>timeformat=[up to 64 characters]<br>noeventsmsg=[plain text up to 200 characters]</code></p><p>Use <code>meta.next_start</code> as the next <code>start</code> value while it is not null. The featured values follow JEM Eventslist semantics: <code>on</code> includes all events, <code>off</code> excludes featured events and <code>only</code> returns only featured events. Results are always evaluated with public guest access, briefly cached and protected by fixed request quotas. Configure <strong>Canonical JEM URL</strong> when external consumers require absolute links; otherwise safe relative links are returned.</p><p><strong>External website example</strong></p><ol><li>Download and extract <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a>.</li><li>Upload <code>jemevents.php</code> and <code>jemevents.js</code> to the external website.</li><li>Set the source URL and token in the server-side <code>jemevents.php</code> file.</li><li>Include <code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code> and add <code>&lt;div id='feed-container'&gt;&lt;/div&gt;</code> to the page.</li></ol>"
